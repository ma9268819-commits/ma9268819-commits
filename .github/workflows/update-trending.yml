name: Update documented Trending winners
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-trending.yml'
      - 'scripts/update-trending.py'
permissions:
  contents: write
concurrency:
  group: documented-trending-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read your repository
        uses: actions/checkout@v4
      - name: Read independent archive (data only)
        uses: actions/checkout@v4
        with:
          repository: antonkomarev/github-trending-archive
          path: _trending-source
          persist-credentials: false
          sparse-checkout: |
            archive/repository
      - name: Generate Arabic guide with immutable evidence links
        run: python3 scripts/update-trending.py _trending-source guides/DOCUMENTED-TRENDING.md
      - name: Save updated list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guides/DOCUMENTED-TRENDING.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh documented Trending winners'
            git push origin HEAD:main
          fi
